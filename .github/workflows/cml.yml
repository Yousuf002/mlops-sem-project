# .github/workflows/cml.yaml
name: CML - Model Performance Gate

on:
  push:
    branches: [dev]

jobs:
  cml-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt scikit-learn pandas joblib

      - name: Train new model (this PR)
        id: train_new
        run: |
          python scripts/train.py data/processed/*.csv > train.log 2>&1 || true
          NEW_RMSE=$(grep "Test RMSE" train.log | tail -1 | awk '{print $4}' || echo "999.0")
          echo "NEW_RMSE=$NEW_RMSE" >> $GITHUB_ENV
          echo "new_rmse=$NEW_RMSE" >> $GITHUB_OUTPUT

      - name: Train production model (master/main)
        id: train_prod
        run: |
          git fetch origin master:main || true
          git checkout master || git checkout main || true
          python scripts/train.py data/processed/*.csv > master.log 2>&1 || true
          OLD_RMSE=$(grep "Test RMSE" master.log | tail -1 | awk '{print $4}' || echo "999.0")
          echo "OLD_RMSE=$OLD_RMSE" >> $GITHUB_ENV
          echo "old_rmse=$OLD_RMSE" >> $GITHUB_OUTPUT

      - name: Post CML Report
        uses: actions/github-script@v7
        with:
          script: |
            const newRmse = parseFloat('${{ steps.train_new.outputs.new_rmse }}');
            const oldRmse = parseFloat('${{ steps.train_prod.outputs.old_rmse }}');
            const better = newRmse < oldRmse;

            const report = `
            ### Model Performance Gate (CML Report)

            **Data versioned with DVC + stored in MinIO (s3://mlflow)**  
            Locally: \`dvc pull\` is used  
            GitHub Actions demo: using data from repository

            | Branch       | Test RMSE     |
            |--------------|---------------|
            | master/main  | ${oldRmse.toFixed(4)} |
            | This PR      | ${newRmse.toFixed(4)} |

            ${better 
              ? 'New model is BETTER → Safe to merge' 
              : 'New model is WORSE → Review recommended'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
