name: CML - Model Performance Gate
on:
  pull_request:
    branches: [test, main, master]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write   # Required to set commit status check

jobs:
  model-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies + DVC
        run: |
          python -m pip install --upgrade pip
          pip install \
            scikit-learn==1.3.2 \
            pandas==2.0.3 \
            numpy==1.25.2 \
            mlflow==2.8.1 \
            joblib==1.3.2 \
            requests \
            "dvc[s3]"  # Change to dvc[gs], dvc[azure], dvc[gdrive] if needed

      - name: Pull real data with DVC
        env:
          # S3 / MinIO credentials (add these in GitHub Secrets!)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          # For GCS: GOOGLE_APPLICATION_CREDENTIALS (upload JSON as secret)
          # For Azure: AZURE_STORAGE_CONNECTION_STRING
        run: |
          echo "Pulling tracked data with DVC..."
          dvc pull data/raw data/processed --jobs 8 || echo "DVC pull failed or no data tracked yet"
          
          echo "Contents of data/ directories:"
          find data -type f -name "*.csv" -o -name "*.csv.dvc" | head -20 || echo "No CSV/DVC files found"

          # Fallback: generate synthetic data only if no real processed file exists
          if ! ls data/processed/*.csv >/dev/null 2>&1; then
            echo "No real processed data found → generating synthetic fallback"
            mkdir -p data/raw data/processed
            python -c "
import pandas as pd, numpy as np
from datetime import datetime
np.random.seed(42)
dates = pd.date_range(end=datetime.now(), periods=200, freq='5min')
close = 300 + np.linspace(0, 10, 200) + np.random.normal(0, 2, 200)
df = pd.DataFrame({
    'timestamp': dates,
    'open': close + np.random.uniform(-1, 1, 200),
    'high': close + np.random.uniform(0, 2, 200),
    'low': close - np.random.uniform(0, 2, 200),
    'close': close,
    'volume': np.random.randint(10000, 100000, 200),
    'symbol': 'IBM'
}).set_index('timestamp')
df.to_csv('data/raw/fallback_test.csv')
print('Synthetic fallback data created')
            "
          fi

      - name: Transform data (PR branch)
        run: |
          python scripts/transform_data.py $(ls data/raw/*.csv | head -1) > transform_pr.log 2>&1 || echo "Transform failed"

      - name: Train model (PR branch)
        id: train_new
        run: |
          PROCESSED_FILE=$(ls -t data/processed/*.csv 2>/dev/null | head -1 || echo "")
          if [ -z "$PROCESSED_FILE" ]; then
            echo "No processed data → using fallback metrics"
            echo "new_rmse=999.0" >> $GITHUB_OUTPUT
            echo "new_mae=999.0" >> $GITHUB_OUTPUT
            echo "new_r2=0.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          export MLFLOW_TRACKING_URI=""
          export DAGSHUB_TOKEN=""

          python scripts/train.py "$PROCESSED_FILE" > train_pr.log 2>&1 || true

          RMSE=$(grep "Test RMSE:" train_pr.log | tail -1 | awk '{print $4}' || echo "999.0")
          MAE=$(grep "Test MAE:" train_pr.log | tail -1 | awk '{print $4}' || echo "999.0")
          R2=$(grep "Test R²:" train_pr.log | tail -1 | awk '{print $4}' || echo "0.0")

          echo "new_rmse=$RMSE" >> $GITHUB_OUTPUT
          echo "new_mae=$MAE" >> $GITHUB_OUTPUT
          echo "new_r2=$R2" >> $GITHUB_OUTPUT
          echo "PR Model → RMSE: $RMSE | MAE: $MAE | R²: $R2"

      - name: Checkout base branch
        run: |
          git fetch origin main || git fetch origin master || true
          git checkout main 2>/dev/null || git checkout master || echo "Base branch not found"

      - name: Pull base branch data with DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc pull data/processed --jobs 8 || echo "No base data to pull"

      - name: Train model (base branch)
        id: train_prod
        run: |
          PROCESSED_FILE=$(ls -t data/processed/*.csv 2>/dev/null | head -1 || echo "")
          if [ -z "$PROCESSED_FILE" ] || [ ! -f scripts/train.py ]; then
            echo "No base data or script → skipping"
            echo "old_rmse=999.0" >> $GITHUB_OUTPUT
            echo "old_mae=999.0" >> $GITHUB_OUTPUT
            echo "old_r2=0.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          export MLFLOW_TRACKING_URI=""
          export DAGSHUB_TOKEN=""

          python scripts/train.py "$PROCESSED_FILE" > train_base.log 2>&1 || true

          RMSE=$(grep "Test RMSE:" train_base.log | tail -1 | awk '{print $4}' || echo "999.0")
          MAE=$(grep "Test MAE:" train_base.log | tail -1 | awk '{print $4}' || echo "999.0")
          R2=$(grep "Test R²:" train_base.log | tail -1 | awk '{print $4}' || echo "0.0")

          echo "old_rmse=$RMSE" >> $GITHUB_OUTPUT
          echo "old_mae=$MAE" >> $GITHUB_OUTPUT
          echo "old_r2=$R2" >> $GITHUB_OUTPUT
          echo "Base Model → RMSE: $RMSE | MAE: $MAE | R²: $R2"

      - name: Generate Performance Report
        uses: actions/github-script@v7
        env:
          NEW_RMSE: ${{ steps.train_new.outputs.new_rmse }}
          NEW_MAE: ${{ steps.train_new.outputs.new_mae }}
          NEW_R2: ${{ steps.train_new.outputs.new_r2 }}
          OLD_RMSE: ${{ steps.train_prod.outputs.old_rmse }}
          OLD_MAE: ${{ steps.train_prod.outputs.old_mae }}
          OLD_R2: ${{ steps.train_prod.outputs.old_r2 }}
        with:
          script: |
            const nr = parseFloat(process.env.NEW_RMSE || 999);
            const nm = parseFloat(process.env.NEW_MAE || 999);
            const n2 = parseFloat(process.env.NEW_R2 || 0);
            const or = parseFloat(process.env.OLD_RMSE || 999);
            const om = parseFloat(process.env.OLD_MAE || 999);
            const o2 = parseFloat(process.env.OLD_R2 || 0);

            const imp = (old, new_, betterLower) => old === 0 || old === 999 ? 0 : ((old - new_) / old) * 100;
            const rmseImp = imp(or, nr, true);
            const maeImp = imp(om, nm, true);
            const r2Imp = o2 === 0 || o2 === 999 ? 0 : ((n2 - o2) / Math.abs(o2)) * 100;

            const better = (nr < or && nm < om) || n2 > o2;
            const emoji = better ? "Model Improved" : "Performance Degraded";

            const format = (v, good) => Math.abs(v) < 0.1 ? "±0.00%" : (good ? "Positive " : "Negative ") + v.toFixed(2) + "%";

            const table = `
            | Metric | Base Branch | PR Branch | Change             | Status     |
            |--------|-------------|-----------|--------------------|------------|
            | RMSE   | ${or.toFixed(4)} | ${nr.toFixed(4)} | ${format(rmseImp, nr < or)} | ${nr < or ? "Better" : "Worse"} |
            | MAE    | ${om.toFixed(4)} | ${nm.toFixed(4)} | ${format(maeImp, nm < om)} | ${nm < om ? "Better" : "Worse"} |
            | R²     | ${o2.toFixed(4)} | ${n2.toFixed(4)} | ${format(r2Imp, n2 > o2)}  | ${n2 > o2 ? "Better" : "Worse"} |`;

            const verdict = better
              ? "**APPROVED** – Model performance improved!"
              : "**REVIEW REQUIRED** – Model regressed. Please check changes.";

            const body = `# ${emoji} Model Performance Report\n\n${table}\n\n### Verdict\n${verdict}\n\n<sub>Generated by CML Gate • [View Run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})</sub>`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: better ? "success" : "failure",
              context: "CML Model Performance Gate",
              description: better ? "Model improved" : "Model degraded",
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cml-training-logs
          path: |
            *.log
            data/processed/*.csv
          retention-days: 14
