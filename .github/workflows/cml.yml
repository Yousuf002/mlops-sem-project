name: CML - Model Performance Gate

on:
  pull_request:
    branches: [test]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  model-comparison:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            scikit-learn==1.3.2 \
            pandas==2.0.3 \
            numpy==1.25.2 \
            mlflow==2.8.1 \
            joblib==1.3.2 \
            requests
            
      - name: 📊 Prepare test data
        run: |
          mkdir -p data/raw data/processed
          
          # Create synthetic stock data for testing
          python << 'EOF'
          import pandas as pd
          import numpy as np
          from datetime import datetime, timedelta
          
          # Generate 200 synthetic 5-minute stock data points
          np.random.seed(42)
          dates = pd.date_range(end=datetime.now(), periods=200, freq='5min')
          
          # Simulate stock prices with trend and noise
          base_price = 300
          trend = np.linspace(0, 10, 200)
          noise = np.random.normal(0, 2, 200)
          close_prices = base_price + trend + noise
          
          df = pd.DataFrame({
              'timestamp': dates,
              'open': close_prices + np.random.uniform(-1, 1, 200),
              'high': close_prices + np.random.uniform(0, 2, 200),
              'low': close_prices - np.random.uniform(0, 2, 200),
              'close': close_prices,
              'volume': np.random.randint(10000, 100000, 200),
              'symbol': 'IBM',
              'extraction_time': datetime.now()
          })
          
          df.set_index('timestamp', inplace=True)
          df.to_csv('data/raw/test_stock_data.csv')
          print(f"✅ Generated {len(df)} synthetic stock data points")
          EOF
          
      - name: 🔧 Transform data (PR branch)
        run: |
          python scripts/transform_data.py data/raw/test_stock_data.csv > transform_pr.log 2>&1
          echo "✅ Data transformation complete"
          
      - name: 🤖 Train model (PR branch)
        id: train_new
        run: |
          # Find the latest processed file
          PROCESSED_FILE=$(ls -t data/processed/*.csv 2>/dev/null | head -1)
          
          if [ -z "$PROCESSED_FILE" ]; then
            echo "❌ No processed data found"
            echo "new_rmse=999.0" >> $GITHUB_OUTPUT
            echo "new_mae=999.0" >> $GITHUB_OUTPUT
            echo "new_r2=0.0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📁 Training on: $PROCESSED_FILE"
          
          # Disable MLflow/DagHub for GitHub Actions
          export MLFLOW_TRACKING_URI=""
          export DAGSHUB_TOKEN=""
          
          python scripts/train.py "$PROCESSED_FILE" > train_pr.log 2>&1 || true
          
          # Extract metrics
          RMSE=$(grep "Test RMSE:" train_pr.log | tail -1 | awk '{print $4}' || echo "999.0")
          MAE=$(grep "Test MAE:" train_pr.log | tail -1 | awk '{print $4}' || echo "999.0")
          R2=$(grep "Test R²:" train_pr.log | tail -1 | awk '{print $4}' || echo "0.0")
          
          echo "new_rmse=$RMSE" >> $GITHUB_OUTPUT
          echo "new_mae=$MAE" >> $GITHUB_OUTPUT
          echo "new_r2=$R2" >> $GITHUB_OUTPUT
          
          echo "✅ PR Model - RMSE: $RMSE, MAE: $MAE, R²: $R2"
          
      - name: 📥 Checkout base branch (master/main)
        run: |
          git fetch origin master 2>/dev/null || git fetch origin main 2>/dev/null || true
          git checkout master 2>/dev/null || git checkout main 2>/dev/null || echo "⚠️ Base branch not found"
          
      - name: 🔧 Transform data (base branch)
        run: |
          if [ -f scripts/transform_data.py ]; then
            python scripts/transform_data.py data/raw/test_stock_data.csv > transform_base.log 2>&1
            echo "✅ Data transformation complete (base)"
          else
            echo "⚠️ Base branch missing transform script"
          fi
          
      - name: 🤖 Train model (base branch)
        id: train_prod
        run: |
          PROCESSED_FILE=$(ls -t data/processed/*.csv 2>/dev/null | head -1)
          
          if [ -z "$PROCESSED_FILE" ] || [ ! -f scripts/train.py ]; then
            echo "⚠️ Base branch model training skipped"
            echo "old_rmse=999.0" >> $GITHUB_OUTPUT
            echo "old_mae=999.0" >> $GITHUB_OUTPUT
            echo "old_r2=0.0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📁 Training on: $PROCESSED_FILE"
          
          # Disable MLflow/DagHub for GitHub Actions
          export MLFLOW_TRACKING_URI=""
          export DAGSHUB_TOKEN=""
          
          python scripts/train.py "$PROCESSED_FILE" > train_base.log 2>&1 || true
          
          # Extract metrics
          RMSE=$(grep "Test RMSE:" train_base.log | tail -1 | awk '{print $4}' || echo "999.0")
          MAE=$(grep "Test MAE:" train_base.log | tail -1 | awk '{print $4}' || echo "999.0")
          R2=$(grep "Test R²:" train_base.log | tail -1 | awk '{print $4}' || echo "0.0")
          
          echo "old_rmse=$RMSE" >> $GITHUB_OUTPUT
          echo "old_mae=$MAE" >> $GITHUB_OUTPUT
          echo "old_r2=$R2" >> $GITHUB_OUTPUT
          
          echo "✅ Base Model - RMSE: $RMSE, MAE: $MAE, R²: $R2"
          
      - name: 📊 Generate CML Report
        uses: actions/github-script@v7
        env:
          NEW_RMSE: ${{ steps.train_new.outputs.new_rmse }}
          NEW_MAE: ${{ steps.train_new.outputs.new_mae }}
          NEW_R2: ${{ steps.train_new.outputs.new_r2 }}
          OLD_RMSE: ${{ steps.train_prod.outputs.old_rmse }}
          OLD_MAE: ${{ steps.train_prod.outputs.old_mae }}
          OLD_R2: ${{ steps.train_prod.outputs.old_r2 }}
        with:
          script: |
            const newRmse = parseFloat(process.env.NEW_RMSE || '999.0');
            const newMae = parseFloat(process.env.NEW_MAE || '999.0');
            const newR2 = parseFloat(process.env.NEW_R2 || '0.0');
            const oldRmse = parseFloat(process.env.OLD_RMSE || '999.0');
            const oldMae = parseFloat(process.env.OLD_MAE || '999.0');
            const oldR2 = parseFloat(process.env.OLD_R2 || '0.0');
            
            // Calculate improvements
            const rmseImprovement = ((oldRmse - newRmse) / oldRmse * 100);
            const maeImprovement = ((oldMae - newMae) / oldMae * 100);
            const r2Improvement = ((newR2 - oldR2) / Math.abs(oldR2) * 100);
            
            // Determine verdict
            const isRmseBetter = newRmse < oldRmse;
            const isMaeBetter = newMae < oldMae;
            const isR2Better = newR2 > oldR2;
            
            const overallBetter = (isRmseBetter && isMaeBetter) || isR2Better;
            
            let verdict, emoji, recommendation;
            if (overallBetter) {
              verdict = "✅ **APPROVED** - Model performance improved";
              emoji = "🎉";
              recommendation = "This model is ready to merge and deploy to production.";
            } else {
              verdict = "⚠️ **REVIEW NEEDED** - Model performance degraded";
              emoji = "🔍";
              recommendation = "Please review the changes and consider:\n- Feature engineering improvements\n- Hyperparameter tuning\n- Data quality checks\n- More training data";
            }
            
            // Format improvements with colors
            const formatChange = (value, better) => {
              if (Math.abs(value) < 0.01) return `±0.00%`;
              const sign = value > 0 ? '+' : '';
              const color = better ? '🟢' : '🔴';
              return `${color} ${sign}${value.toFixed(2)}%`;
            };
            
            const report = `
            ## ${emoji} Model Performance Comparison Report
            
            ### 📊 Metrics Summary
            
            | Metric | Base (master/main) | This PR | Change | Status |
            |--------|-------------------|---------|--------|--------|
            | **RMSE** (↓ better) | ${oldRmse.toFixed(4)} | ${newRmse.toFixed(4)} | ${formatChange(rmseImprovement, isRmseBetter)} | ${isRmseBetter ? '✅ Better' : '❌ Worse'} |
            | **MAE** (↓ better) | ${oldMae.toFixed(4)} | ${newMae.toFixed(4)} | ${formatChange(maeImprovement, isMaeBetter)} | ${isMaeBetter ? '✅ Better' : '❌ Worse'} |
            | **R²** (↑ better) | ${oldR2.toFixed(4)} | ${newR2.toFixed(4)} | ${formatChange(r2Improvement, isR2Better)} | ${isR2Better ? '✅ Better' : '❌ Worse'} |
            
            ### 🎯 Verdict
            
            ${verdict}
            
            ### 💡 Recommendation
            
            ${recommendation}
            
            ### 📝 Notes
            
            - **Data:** Synthetic test data (200 samples, 5-min intervals)
            - **Model:** Random Forest Regressor
            - **Features:** 38 engineered features (lag, rolling stats, technical indicators)
            - **DVC:** Data versioned with DVC + stored in MinIO
            - **Full logs:** Available in [GitHub Actions](${context.payload.pull_request.html_url}/checks)
            
            ### 🔗 Quick Links
            
            - [View DagHub Experiments](https://dagshub.com/Yousuf002/mlops-rps-stock-prediction/experiments)
            - [View Model Artifacts](https://dagshub.com/Yousuf002/mlops-rps-stock-prediction/experiments)
            - [Project Documentation](https://github.com/${context.repo.owner}/${context.repo.repo})
            
            ---
            
            <sub>🤖 Posted by CML Bot • [View workflow run](${context.payload.pull_request.html_url}/checks)</sub>
            `.trim();
            
            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
            
            // Set PR status check
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: overallBetter ? 'success' : 'failure',
              context: 'CML Model Performance',
              description: overallBetter ? 'Model improved ✅' : 'Model degraded ⚠️',
              target_url: context.payload.pull_request.html_url
            });
            
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: training-logs
          path: |
            train_pr.log
            train_base.log
            transform_pr.log
            transform_base.log
          retention-days: 7
