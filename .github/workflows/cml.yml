name: CML - Model Performance Gate

on:
  pull_request:
    branches: [test]

jobs:
  cml-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt scikit-learn pandas joblib

      - name: Train new model (this PR)
        id: train_new
        run: |
          python scripts/train.py data/processed/*.csv > train.log 2>&1 || true
          RMSE=$(grep "Test RMSE" train.log | tail -1 | awk '{print $4}' || echo "999.0")
          echo "new_rmse=$RMSE" >> $GITHUB_OUTPUT

      - name: Train production model (master/main)
        id: train_prod
        run: |
          git fetch origin master:main 2>/dev/null || true
          git checkout master 2>/dev/null || git checkout main 2>/dev/null || true
          python scripts/train.py data/processed/*.csv > prod.log 2>&1 || true
          RMSE=$(grep "Test RMSE" prod.log | tail -1 | awk '{print $4}' || echo "999.0")
          echo "old_rmse=$RMSE" >> $GITHUB_OUTPUT

      - name: Post CML Report
        uses: actions/github-script@v7
        env:
          NEW_RMSE: ${{ steps.train_new.outputs.new_rmse }}
          OLD_RMSE: ${{ steps.train_prod.outputs.old_rmse }}
        with:
          script: |
            const newRmse = parseFloat(process.env.NEW_RMSE || '999.0');
            const oldRmse = parseFloat(process.env.OLD_RMSE || '999.0');

            const verdict = newRmse < oldRmse
              ? "New model is **BETTER** — Approved"
              : "New model is **WORSE** — Review needed";

            const report = `
            ### Model Performance Gate (CML Report)

            **Data versioned with DVC + stored in MinIO (s3://mlflow)**
            - Local / Real CI: \`dvc pull\`
            - GitHub Actions demo: uses data from repository

            | Branch       | Test RMSE     |
            |--------------|---------------|
            | master/main  | ${oldRmse.toFixed(4)} |
            | This PR      | ${newRmse.toFixed(4)} |

            **Verdict:** ${verdict}
            `.trim();

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
