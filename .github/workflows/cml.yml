# .github/workflows/cml.yaml
name: CML - Model Performance Gate

on:
  pull_request:
    branches: [test]

jobs:
  cml-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt scikit-learn pandas joblib

      - name: Train new model (this PR)
        run: |
          python scripts/train.py data/processed/*.csv > train.log 2>&1
          NEW_RMSE=$(grep "Test RMSE" train.log | tail -1 | awk '{print $4}' || echo "999")
          echo "NEW_RMSE=$NEW_RMSE" >> $GITHUB_ENV

      - name: Train production model (master)
        run: |
          git checkout master || git checkout main
          python scripts/train.py data/processed/*.csv > master.log 2>&1 || true
          OLD_RMSE=$(grep "Test RMSE" master.log | tail -1 | awk '{print $4}' || echo "999")
          echo "OLD_RMSE=$OLD_RMSE" >> $GITHUB_ENV

      - name: Post CML Report
        uses: actions/github-script@v7
        with:
          script: |
            const report = `
            ### Model Performance Gate (CML Report)

            **Data is versioned with DVC + stored in MinIO (s3://mlflow)**  
            In local environment / real CI: \`dvc pull\` is used  
            In GitHub Actions demo: using processed data from repo

            | Branch       | Test RMSE   |
            |--------------|-------------|
            | master (prod)| ${{ env.OLD_RMSE }} |
            | This PR      | ${{ env.NEW_RMSE }} |

            ${{ env.NEW_RMSE < env.OLD_RMSE ? 'New model is better → Approved' : 'New model is worse → Review needed'}}
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
