name: CML - Model Performance Gate

on:
  pull_request:
    branches: [test, main, master]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  model-comparison:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies + DVC
        run: |
          python -m pip install --upgrade pip
          pip install \
            scikit-learn==1.3.2 \
            pandas==2.0.3 \
            numpy==1.25.2 \
            mlflow==2.8.1 \
            joblib==1.3.2 \
            requests \
            "dvc[s3]"

      - name: Pull real data with DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          # use a shell fallback for the region if secret isn't provided
          export AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}

          echo "Pulling tracked data with DVC..."
          dvc pull data/raw data/processed --jobs 8 || echo "DVC pull failed (maybe no data tracked yet)"

          echo "Listing data directory (first 20 files):"
          find data -maxdepth 3 -type f | head -20 || true

          # Fallback: generate synthetic data only if no real processed CSV exists
          if ! ls data/processed/*.csv >/dev/null 2>&1; then
            echo "No real processed data found → generating synthetic fallback"
            mkdir -p data/raw data/processed
            python - <<'PY'
import pandas as pd, numpy as np
from datetime import datetime
np.random.seed(42)
dates = pd.date_range(end=datetime.now(), periods=200, freq='5min')
close = 300 + np.linspace(0, 10, 200) + np.random.normal(0, 2, 200)
df = pd.DataFrame({
    'timestamp': dates,
    'open': close + np.random.uniform(-1, 1, 200),
    'high': close + np.random.uniform(0, 2, 200),
    'low': close - np.random.uniform(0, 2, 200),
    'close': close,
    'volume': np.random.randint(10000, 100000, 200),
    'symbol': 'IBM'
}).set_index('timestamp')
df.to_csv('data/raw/fallback_test.csv')
print('Synthetic fallback data created')
PY
          fi

      - name: Transform data (PR branch)
        run: |
          RAW_FILE=$(ls data/raw/*.csv | head -1)
          python scripts/transform_data.py "$RAW_FILE" > transform_pr.log 2>&1 || echo "Transform failed"

      - name: Train model (PR branch)
        id: train_new
        run: |
          PROCESSED_FILE=$(ls -t data/processed/*.csv 2>/dev/null | head -1 || echo "")
          if [ -z "$PROCESSED_FILE" ]; then
            echo "new_rmse=999.0" >> $GITHUB_OUTPUT
            echo "new_mae=999.0" >> $GITHUB_OUTPUT
            echo "new_r2=0.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          python scripts/train.py "$PROCESSED_FILE" > train_pr.log 2>&1 || true

          RMSE=$(grep "Test RMSE:" train_pr.log | tail -1 | awk '{print $4}' || echo "999.0")
          MAE=$(grep "Test MAE:" train_pr.log | tail -1 | awk '{print $4}' || echo "999.0")
          R2=$(grep "Test R²:" train_pr.log | tail -1 | awk '{print $4}' || echo "0.0")

          echo "new_rmse=$RMSE" >> $GITHUB_OUTPUT
          echo "new_mae=$MAE" >> $GITHUB_OUTPUT
          echo "new_r2=$R2" >> $GITHUB_OUTPUT

      - name: Checkout base branch
        run: |
          git fetch origin main || git fetch origin master || true
          git checkout main 2>/dev/null || git checkout master || true

      - name: Pull base branch data with DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc pull data/processed --jobs 8 || echo "No base data to pull"

      - name: Train model (base branch)
        id: train_prod
        run: |
          PROCESSED_FILE=$(ls -t data/processed/*.csv 2>/dev/null | head -1 || echo "")
          if [ -z "$PROCESSED_FILE" ] || [ ! -f scripts/train.py ]; then
            echo "old_rmse=999.0" >> $GITHUB_OUTPUT
            echo "old_mae=999.0" >> $GITHUB_OUTPUT
            echo "old_r2=0.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          python scripts/train.py "$PROCESSED_FILE" > train_base.log 2>&1 || true

          RMSE=$(grep "Test RMSE:" train_base.log | tail -1 | awk '{print $4}' || echo "999.0")
          MAE=$(grep "Test MAE:" train_base.log | tail -1 | awk '{print $4}' || echo "999.0")
          R2=$(grep "Test R²:" train_base.log | tail -1 | awk '{print $4}' || echo "0.0")

          echo "old_rmse=$RMSE" >> $GITHUB_OUTPUT
          echo "old_mae=$MAE" >> $GITHUB_OUTPUT
          echo "old_r2=$R2" >> $GITHUB_OUTPUT

      - name: Generate Performance Report
        uses: actions/github-script@v7
        env:
          NEW_RMSE: ${{ steps.train_new.outputs.new_rmse }}
          NEW_MAE: ${{ steps.train_new.outputs.new_mae }}
          NEW_R2: ${{ steps.train_new.outputs.new_r2 }}
          OLD_RMSE: ${{ steps.train_prod.outputs.old_rmse }}
          OLD_MAE: ${{ steps.train_prod.outputs.old_mae }}
          OLD_R2: ${{ steps.train_prod.outputs.old_r2 }}
        with:
          script: |
            const nr = parseFloat(process.env.NEW_RMSE || 999);
            const nm = parseFloat(process.env.NEW_MAE || 999);
            const nr2 = parseFloat(process.env.NEW_R2 || 0);

            const or = parseFloat(process.env.OLD_RMSE || 999);
            const om = parseFloat(process.env.OLD_MAE || 999);
            const or2 = parseFloat(process.env.OLD_R2 || 0);

            const body = `
### 📊 Model Performance Comparison

| Metric | Base Model | PR Model | Change |
|-------|------------:|---------:|-------:|
| **RMSE** | ${or} | ${nr} | ${(nr - or).toFixed(4)} |
| **MAE**  | ${om} | ${nm} | ${(nm - om).toFixed(4)} |
| **R²**   | ${or2} | ${nr2} | ${(nr2 - or2).toFixed(4)} |

---

### 📌 Decision
${nr <= or ? "✅ **PR model is better or equal → Approved**" : "❌ **PR model performs worse → Review required**"}
`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
