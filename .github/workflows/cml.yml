name: CML - Model Performance Gate
on:
  pull_request:
    branches: [test]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  model-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            scikit-learn==1.3.2 \
            pandas==2.0.3 \
            numpy==1.25.2 \
            mlflow==2.8.1 \
            joblib==1.3.2 \
            requests \
            dvc[s3]

      - name: Configure DVC and DagHub Authentication
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER || 'Yousuf002' }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN || '4a8466f05f9f3f2c2cb41a4ab9ccb5b6b1050587' }}
        run: |
          # Check if DVC is initialized
          if [ ! -f .dvc/config ]; then
            echo "DVC not initialized. Initializing now..."
            dvc init --no-scm
          fi
          
          # List existing remotes
          echo "Existing DVC remotes:"
          dvc remote list || echo "No remotes configured"
          
          # Get the default remote name (usually 'origin' or 'storage')
          REMOTE_NAME=$(dvc remote list | head -1 | awk '{print $1}' || echo "")
          
          if [ -z "$REMOTE_NAME" ]; then
            echo "No DVC remote found. Setting up DagHub remote..."
            dvc remote add -d origin https://dagshub.com/Yousuf002/mlops-rps-stock-prediction.dvc
            REMOTE_NAME="origin"
          fi
          
          echo "Using DVC remote: $REMOTE_NAME"
          
          # Configure authentication for the remote
          dvc remote modify $REMOTE_NAME --local auth basic
          dvc remote modify $REMOTE_NAME --local user ${DAGSHUB_USER}
          dvc remote modify $REMOTE_NAME --local password ${DAGSHUB_TOKEN}
          
          echo "DVC remote configured successfully"

      - name: Prepare test data
        run: |
          mkdir -p data/raw data/processed
          
          python << 'EOF'
          import pandas as pd
          import numpy as np
          from datetime import datetime

          np.random.seed(42)
          dates = pd.date_range(end=datetime.now(), periods=200, freq='5min')
          base_price = 300
          trend = np.linspace(0, 10, 200)
          noise = np.random.normal(0, 2, 200)
          close_prices = base_price + trend + noise

          df = pd.DataFrame({
              'timestamp': dates,
              'open': close_prices + np.random.uniform(-1, 1, 200),
              'high': close_prices + np.random.uniform(0, 2, 200),
              'low': close_prices - np.random.uniform(0, 2, 200),
              'close': close_prices,
              'volume': np.random.randint(10000, 100000, 200),
              'symbol': 'IBM',
              'extraction_time': datetime.now()
          })
          df.set_index('timestamp', inplace=True)
          df.to_csv('data/raw/test_stock_data.csv')
          print(f"Generated {len(df)} synthetic stock data points")
          EOF

      - name: Transform data (PR branch)
        run: |
          python scripts/transform_data.py data/raw/test_stock_data.csv > transform_pr.log 2>&1
          echo "Data transformation complete (PR)"

      - name: Pull DVC data (PR branch)
        run: |
          echo "Attempting to pull DVC-tracked files..."
          
          # Check if there are any .dvc files
          if ls data/processed/*.csv.dvc 1> /dev/null 2>&1; then
            echo "Found .dvc files. Pulling data..."
            dvc pull data/processed/*.csv.dvc 2>&1 | tee dvc_pull_pr.log || {
              echo "Warning: DVC pull encountered errors"
              cat dvc_pull_pr.log
            }
          else
            echo "No .dvc files found in data/processed/"
          fi
          
          # List available files
          echo ""
          echo "Available processed files:"
          ls -lh data/processed/ 2>/dev/null || echo "No files in data/processed/"

      - name: Train model (PR branch)
        id: train_new
        run: |
          # Find the most recent CSV file (pulled from DVC or newly created)
          PROCESSED_FILE=$(ls -t data/processed/*.csv 2>/dev/null | head -1 || echo "")
          
          if [ -z "$PROCESSED_FILE" ]; then
            echo "No processed data found"
            echo "new_rmse=999.0" >> $GITHUB_OUTPUT
            echo "new_mae=999.0" >> $GITHUB_OUTPUT
            echo "new_r2=0.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Training with file: $PROCESSED_FILE"

          export MLFLOW_TRACKING_URI=""
          export DAGSHUB_TOKEN=""

          python scripts/train.py "$PROCESSED_FILE" > train_pr.log 2>&1 || true

          # Extract metrics with better error handling
          RMSE=$(grep "Test RMSE:" train_pr.log | tail -1 | awk '{print $NF}' | tr -d '\r' || echo "999.0")
          MAE=$(grep "Test MAE:" train_pr.log | tail -1 | awk '{print $NF}' | tr -d '\r' || echo "999.0")
          R2=$(grep "Test R²:" train_pr.log | tail -1 | awk '{print $NF}' | tr -d '\r' || echo "0.0")

          # Validate numeric values
          RMSE=$(echo "$RMSE" | grep -E '^[0-9]+\.?[0-9]*$' || echo "999.0")
          MAE=$(echo "$MAE" | grep -E '^[0-9]+\.?[0-9]*$' || echo "999.0")
          R2=$(echo "$R2" | grep -E '^-?[0-9]+\.?[0-9]*$' || echo "0.0")

          echo "new_rmse=$RMSE" >> $GITHUB_OUTPUT
          echo "new_mae=$MAE" >> $GITHUB_OUTPUT
          echo "new_r2=$R2" >> $GITHUB_OUTPUT
          echo "PR Model - RMSE: $RMSE, MAE: $MAE, R²: $R2"

      - name: Checkout base branch (main/master)
        run: |
          git fetch origin main || git fetch origin master || true
          git checkout main || git checkout master || echo "Base branch not found"

      - name: Transform data (base branch)
        run: |
          if [ -f scripts/transform_data.py ]; then
            python scripts/transform_data.py data/raw/test_stock_data.csv > transform_base.log 2>&1
          else
            echo "transform_data.py missing in base branch"
          fi

      - name: Pull DVC data (base branch)
        run: |
          echo "Attempting to pull DVC-tracked files from base branch..."
          
          # Check if there are any .dvc files
          if ls data/processed/*.csv.dvc 1> /dev/null 2>&1; then
            echo "Found .dvc files. Pulling data..."
            dvc pull data/processed/*.csv.dvc 2>&1 | tee dvc_pull_base.log || {
              echo "Warning: DVC pull encountered errors"
              cat dvc_pull_base.log
            }
          else
            echo "No .dvc files found in data/processed/"
          fi
          
          # List available files
          echo ""
          echo "Available processed files:"
          ls -lh data/processed/ 2>/dev/null || echo "No files in data/processed/"

      - name: Train model (base branch)
        id: train_prod
        run: |
          PROCESSED_FILE=$(ls -t data/processed/*.csv 2>/dev/null | head -1 || echo "")
          
          if [ -z "$PROCESSED_FILE" ] || [ ! -f scripts/train.py ]; then
            echo "Skipping base model training"
            echo "old_rmse=999.0" >> $GITHUB_OUTPUT
            echo "old_mae=999.0" >> $GITHUB_OUTPUT
            echo "old_r2=0.0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Training with file: $PROCESSED_FILE"

          export MLFLOW_TRACKING_URI=""
          export DAGSHUB_TOKEN=""

          python scripts/train.py "$PROCESSED_FILE" > train_base.log 2>&1 || true

          # Extract metrics with better error handling
          RMSE=$(grep "Test RMSE:" train_base.log | tail -1 | awk '{print $NF}' | tr -d '\r' || echo "999.0")
          MAE=$(grep "Test MAE:" train_base.log | tail -1 | awk '{print $NF}' | tr -d '\r' || echo "999.0")
          R2=$(grep "Test R²:" train_base.log | tail -1 | awk '{print $NF}' | tr -d '\r' || echo "0.0")

          # Validate numeric values
          RMSE=$(echo "$RMSE" | grep -E '^[0-9]+\.?[0-9]*$' || echo "999.0")
          MAE=$(echo "$MAE" | grep -E '^[0-9]+\.?[0-9]*$' || echo "999.0")
          R2=$(echo "$R2" | grep -E '^-?[0-9]+\.?[0-9]*$' || echo "0.0")

          echo "old_rmse=$RMSE" >> $GITHUB_OUTPUT
          echo "old_mae=$MAE" >> $GITHUB_OUTPUT
          echo "old_r2=$R2" >> $GITHUB_OUTPUT
          echo "Base Model - RMSE: $RMSE, MAE: $MAE, R²: $R2"

      - name: Generate CML Report
        uses: actions/github-script@v7
        env:
          NEW_RMSE: ${{ steps.train_new.outputs.new_rmse }}
          NEW_MAE: ${{ steps.train_new.outputs.new_mae }}
          NEW_R2: ${{ steps.train_new.outputs.new_r2 }}
          OLD_RMSE: ${{ steps.train_prod.outputs.old_rmse }}
          OLD_MAE: ${{ steps.train_prod.outputs.old_mae }}
          OLD_R2: ${{ steps.train_prod.outputs.old_r2 }}
        with:
          script: |
            const newRmse = parseFloat(process.env.NEW_RMSE || '999.0');
            const newMae = parseFloat(process.env.NEW_MAE || '999.0');
            const newR2 = parseFloat(process.env.NEW_R2 || '0.0');
            const oldRmse = parseFloat(process.env.OLD_RMSE || '999.0');
            const oldMae = parseFloat(process.env.OLD_MAE || '999.0');
            const oldR2 = parseFloat(process.env.OLD_R2 || '0.0');

            const rmseImp = oldRmse === 0 ? 0 : ((oldRmse - newRmse) / oldRmse) * 100;
            const maeImp = oldMae === 0 ? 0 : ((oldMae - newMae) / oldMae) * 100;
            const r2Imp = oldR2 === 0 ? 0 : ((newR2 - oldR2) / Math.abs(oldR2)) * 100;

            const betterRmse = newRmse < oldRmse;
            const betterMae = newMae < oldMae;
            const betterR2 = newR2 > oldR2;
            const overallBetter = (betterRmse && betterMae) || betterR2;

            const format = (val, good) => {
              if (Math.abs(val) < 0.01) return "±0.00%";
              return (good ? "🟢 +" : "🔴 ") + val.toFixed(2) + "%";
            };

            const report = `
            ## ${overallBetter ? "✅ Model Improved" : "⚠️ Performance Degraded"} Model Performance Report

            ### Metrics Summary
            | Metric | Base Branch | This PR   | Change              | Status     |
            |--------|-------------|-----------|---------------------|------------|
            | RMSE ↓ | ${oldRmse.toFixed(4)} | ${newRmse.toFixed(4)} | ${format(rmseImp, betterRmse)} | ${betterRmse ? "✅ Better" : "❌ Worse"} |
            | MAE ↓  | ${oldMae.toFixed(4)}  | ${newMae.toFixed(4)}  | ${format(maeImp, betterMae)}  | ${betterMae ? "✅ Better" : "❌ Worse"}  |
            | R² ↑   | ${oldR2.toFixed(4)}   | ${newR2.toFixed(4)}   | ${format(r2Imp, betterR2)}    | ${betterR2 ? "✅ Better" : "❌ Worse"}   |

            ### Verdict
            ${overallBetter 
              ? "**✅ APPROVED** - Model performance improved or maintained" 
              : "**⚠️ REVIEW NEEDED** - Model performance degraded"}

            <sub>Generated by CML Bot • [View Run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})</sub>
            `.trim();

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: overallBetter ? 'success' : 'failure',
              context: 'CML Model Performance Gate',
              description: overallBetter ? 'Model improved' : 'Model degraded',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

      - name: Upload training logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-training-logs
          path: |
            train_pr.log
            train_base.log
            transform_pr.log
            transform_base.log
            dvc_pull_pr.log
            dvc_pull_base.log
          retention-days: 7
