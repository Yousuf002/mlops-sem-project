version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: mlops-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: mlops-airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - ALPHA_VANTAGE_API_KEY=42MPNIZX1S8YL97E
      - DAGSHUB_REPO_OWNER=Yousuf002  # ← CHANGE THIS
      - DAGSHUB_REPO_NAME=mlops-rps-stock-prediction   # ← CHANGE THIS
      - DAGSHUB_USER=Yousuf002         # ← CHANGE THIS
      - DAGSHUB_TOKEN=4a8466f05f9f3f2c2cb41a4ab9ccb5b6b1050587  # ← CHANGE THIS
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./config.py:/opt/airflow/config.py
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
          airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: mlops-airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - ALPHA_VANTAGE_API_KEY=42MPNIZX1S8YL97E
      - DAGSHUB_REPO_OWNER=Yousuf002  # ← CHANGE THIS
      - DAGSHUB_REPO_NAME=mlops-rps-stock-prediction   # ← CHANGE THIS
      - DAGSHUB_USER=Yousuf002         # ← CHANGE THIS
      - DAGSHUB_TOKEN=4a8466f05f9f3f2c2cb41a4ab9ccb5b6b1050587  # ← CHANGE THIS
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./config.py:/opt/airflow/config.py
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: airflow webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: mlops-airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - ALPHA_VANTAGE_API_KEY=42MPNIZX1S8YL97E
      - DAGSHUB_REPO_OWNER=Yousuf002  # ← CHANGE THIS
      - DAGSHUB_REPO_NAME=mlops-rps-stock-prediction   # ← CHANGE THIS
      - DAGSHUB_USER=Yousuf002         # ← CHANGE THIS
      - DAGSHUB_TOKEN=4a8466f05f9f3f2c2cb41a4ab9ccb5b6b1050587
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./config.py:/opt/airflow/config.py
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: airflow scheduler
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: mlops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: mlops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mlops-fastapi
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/model_latest.joblib
    volumes:
      - ./models:/app/models
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data: